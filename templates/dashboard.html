<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BugSense AI - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', sans-serif;
        }
        .navbar {
            background: #1e293b !important;
            border-bottom: 1px solid #334155;
        }
        .stat-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-label {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
        }
        .chart-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
        }
        .table-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
        }
        .table {
            color: #e2e8f0;
        }
        .table thead {
            border-bottom: 1px solid #334155;
        }
        .badge-critical { background: #ef4444; }
        .badge-high     { background: #f97316; }
        .badge-medium   { background: #eab308; color: #000; }
        .badge-low      { background: #22c55e; }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-4 py-3 mb-4">
    <span class="navbar-brand fw-bold fs-5">📊 BugSense AI - Dashboard</span>
    <a href="/" class="btn btn-outline-light btn-sm">🐛 Classify Bug</a>
</nav>

<div class="container">

    <!-- Stats Row -->
    <div class="row g-3 mb-4">
        <div class="col-md-3 col-6">
            <div class="stat-card">
                <div class="stat-label">Total Bugs</div>
                <div class="stat-number text-primary" id="totalCount">0</div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="stat-card">
                <div class="stat-label">Critical</div>
                <div class="stat-number text-danger" id="criticalCount">0</div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="stat-card">
                <div class="stat-label">High</div>
                <div class="stat-number text-warning" id="highCount">0</div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="stat-card">
                <div class="stat-label">Low / Medium</div>
                <div class="stat-number text-success" id="lowCount">0</div>
            </div>
        </div>
    </div>

    <!-- Charts Row -->
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <div class="chart-card">
                <h6 class="mb-3 text-muted">Bugs by Severity</h6>
                <canvas id="severityChart"></canvas>
            </div>
        </div>
        <div class="col-md-6">
            <div class="chart-card">
                <h6 class="mb-3 text-muted">Bugs by Category</h6>
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Bug Table -->
    <div class="table-card mb-4">
        <h6 class="mb-3 text-muted">All Classified Bugs</h6>
        <div class="empty-state" id="emptyState">
            No bugs classified yet.
            <br>
            <a href="/" class="text-primary">Go classify some bugs!</a>
        </div>
        <table class="table table-borderless" id="bugTable" style="display:none;">
            <thead>
                <tr class="text-muted">
                    <th>#</th>
                    <th>Bug Description</th>
                    <th>Severity</th>
                    <th>Category</th>
                    <th>Confidence</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="bugTableBody"></tbody>
        </table>
    </div>

</div>

<script>
const bugData = {{ data | safe }};

const severityColors = {
    'Critical': '#ef4444',
    'High':     '#f97316',
    'Medium':   '#eab308',
    'Low':      '#22c55e'
};

const categoryColors = ['#6366f1', '#06b6d4', '#8b5cf6', '#ec4899'];

function buildDashboard() {
    if (bugData.length === 0) return;

    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('bugTable').style.display = 'table';

    document.getElementById('totalCount').textContent = bugData.length;
    document.getElementById('criticalCount').textContent =
        bugData.filter(b => b.severity === 'Critical').length;
    document.getElementById('highCount').textContent =
        bugData.filter(b => b.severity === 'High').length;
    document.getElementById('lowCount').textContent =
        bugData.filter(b => b.severity === 'Low' || b.severity === 'Medium').length;

    const sevCounts = {};
    bugData.forEach(b => {
        sevCounts[b.severity] = (sevCounts[b.severity] || 0) + 1;
    });

    new Chart(document.getElementById('severityChart'), {
        type: 'doughnut',
        data: {
            labels: Object.keys(sevCounts),
            datasets: [{
                data: Object.values(sevCounts),
                backgroundColor: Object.keys(sevCounts).map(k => severityColors[k])
            }]
        },
        options: {
            plugins: {
                legend: { labels: { color: '#e2e8f0' } }
            }
        }
    });

    const catCounts = {};
    bugData.forEach(b => {
        catCounts[b.category] = (catCounts[b.category] || 0) + 1;
    });

    new Chart(document.getElementById('categoryChart'), {
        type: 'bar',
        data: {
            labels: Object.keys(catCounts),
            datasets: [{
                label: 'Bug Count',
                data: Object.values(catCounts),
                backgroundColor: categoryColors
            }]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: {
                x: {
                    ticks: { color: '#e2e8f0' },
                    grid: { color: '#334155' }
                },
                y: {
                    ticks: { color: '#e2e8f0', stepSize: 1 },
                    grid: { color: '#334155' }
                }
            }
        }
    });

    const rows = bugData.map((b, i) => `
        <tr>
            <td class="text-muted">${i + 1}</td>
            <td style="max-width:250px; overflow:hidden;
                text-overflow:ellipsis; white-space:nowrap;">
                ${b.text}
            </td>
            <td>
                <span class="badge badge-${b.severity.toLowerCase()}">
                    ${b.severity}
                </span>
            </td>
            <td>${b.category}</td>
            <td class="text-success">${b.confidence}%</td>
            <td class="text-muted">${b.time || '-'}</td>
        </tr>
    `).join('');

    document.getElementById('bugTableBody').innerHTML = rows;
}

buildDashboard();
</script>

</body>
</html>
